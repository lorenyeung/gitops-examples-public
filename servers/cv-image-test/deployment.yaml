apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-image-test
  namespace: tmpgitops
  labels:
    app: cv-image-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv-image-test
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cv-image-test
        version: "bad-nginx"
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
