apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-image-test
  namespace: tmpgitops
  labels:
    app: cv-image-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv-image-test
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cv-image-test
        version: "v0.6.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: metrics
        image: quay.io/brancz/prometheus-example-app:v0.6.0
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
